<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trail</title>
  <link rel="stylesheet" href="../Styles/great-outdoors.css">
  <link rel="stylesheet" href="../Styles/trail.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div id="site-nav-container"></div>

  <!-- ═══════════════════════════════════════════════
       STATIC STRUCTURE
       Add/remove/rearrange elements here to change
       what the page shows and in what order.
  ════════════════════════════════════════════════ -->

  <div id="status" class="status-screen">
    <div class="spinner"></div>
    <span>Loading trail…</span>
  </div>

  <div id="content" style="display:none">

    <!-- Header -->
    <!-- <div class="trail-header">
      <svg class="header-mountains" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-hidden="true">
        <polygon points="0,120 120,30 240,80 380,10 520,60 660,20 800,70 800,120" fill="var(--white)"/>
      </svg>
      <div class="trail-header-inner">
        <a id="edit-trail-btn"><i class="ti ti-edit"></i> Edit Trail</a>
        <div id="name"></div>
        <p id="org"></p>
      </div>
    </div> -->
    <div class="trail-header">
      <img class="header-hero-img" src="../Images/pilchuk.jpg" alt="Mountain at sunset">
      <div class="header-hero-overlay"></div>
      <div class="trail-header-inner">
        <a id="edit-trail-btn"><i class="ti ti-edit"></i> Edit Trail</a>
        <div id="name"></div>
        <p id="org"></p>
      </div>
    </div>

    <!-- Stat strip -->
    <div class="stat-strip">
      <div class="stat-strip-item">
        <span class="stat-strip-val" id="stat-length">—</span>
        <span class="stat-strip-lbl">Miles</span>
      </div>
      <div class="stat-strip-item">
        <span class="stat-strip-val" id="stat-gain">—</span>
        <span class="stat-strip-lbl">Elev. Gain</span>
      </div>
      <div class="stat-strip-item">
        <span class="stat-strip-val" id="stat-type">—</span>
        <span class="stat-strip-lbl">Type</span>
      </div>
      <div class="stat-strip-item">
        <span class="stat-strip-val" id="stat-time">—</span>
        <span class="stat-strip-lbl">Est. Hours</span>
      </div>
    </div>

    <!-- Body -->
    <div class="trail-body">

      <!-- Main column -->
      <div class="trail-main">

        <div id="images"></div>

        <span class="section-label" id="desc-label" style="display:none">About this trail</span>
        <p id="description"></p>

        <div class="tag-section" id="surfaces-section" style="display:none">
          <span class="section-label">Surfaces</span>
          <div class="tag-row" id="surfaces"></div>
        </div>

        <div class="tag-section" id="biomes-section" style="display:none">
          <span class="section-label">Biomes</span>
          <div class="tag-row" id="biomes"></div>
        </div>

        <p id="last-edited"></p>

      </div>

      <!-- Sidebar -->
      <div class="trail-sidebar">
        <div class="info-card">
          <div class="info-card-header">Trail Details</div>
          <div class="info-row" id="row-type" style="display:none">
            <span class="info-row-label">Type</span>
            <span class="info-row-value" id="type"></span>
          </div>
          <div class="info-row" id="row-start-elev" style="display:none">
            <span class="info-row-label">Starting Elev.</span>
            <span class="info-row-value" id="start-elev"></span>
          </div>
          <div class="info-row" id="row-roughness" style="display:none">
            <span class="info-row-label">Roughness</span>
            <span class="info-row-value"><div class="pip-row" id="roughness"></div></span>
          </div>
          <div class="info-row" id="row-hours" style="display:none">
            <span class="info-row-label">Hours</span>
            <span class="info-row-value" id="hours"></span>
          </div>
          <div class="info-row" id="row-location" style="display:none; flex-direction: column; align-items: stretch;">
            <div id="trail-map" class="trail-map"></div>
            <p id="location-label" style="
              font-size: 11px;
              color: var(--trail-fog);
              text-align: center;
              padding: 0.4rem 0 0;
              letter-spacing: 0.04em;
            "></p>
          </div>
        </div>
      </div>
      <!-- I've Hiked This Button -->
      <div class="hiked-trail-box">
        <button id="hiked-trail-btn" class="hiked-trail-btn" type="button">
          <i class="ti ti-check"></i> I've hiked this
        </button>
        <p id="hiked-trail-help" class="hiked-trail-help"></p>
      </div>

      <!-- Comments (full width) -->
      <div class="comments-section">
        <h3>Comments</h3>
        <div id="comments"></div>
        <div id="comment-form" style="display:none">
          <textarea id="comment-input" rows="3" maxlength="1000" placeholder="Write a comment…"></textarea>
          <button id="comment-submit" style="color:var(--trail-ray)"><i class="ti ti-send"></i> Post</button>
        </div>
       <p id="comment-login">You must be <a id="comment-login-link" href="login.html" style="color:var(--trail-ray)">logged in</a> to comment.</p>
      </div>

    </div><!-- /trail-body -->
  </div><!-- /content -->

  <script type="module">
    import { initializeApp }                                          from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc, getDocs, setDoc, serverTimestamp }   from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { query, where, orderBy, addDoc, updateDoc, deleteDoc,
             collection, firebaseConfig, onAuthStateChanged, auth }  from "../Scripts/great_outdoors.js";
    import { isModerator, isUserBanned } from "../Scripts/great_outdoors.js";

    const db = getFirestore(initializeApp(firebaseConfig));


    // ═══════════════════════════════════════════════
    //  RENDER FUNCTIONS
    //  Change how things look by editing these.
    // ════════════════════════════════════════════════

    function renderTrail(t, id) {
      document.title = t.name;
      document.getElementById("name").textContent = t.name;
      document.getElementById("org").textContent  = t.associated_org ?? "";

      // Stat strip
      document.getElementById("stat-length").textContent = t.length_mi      ? t.length_mi + " mi"                      : "—";
      document.getElementById("stat-gain").textContent   = t.elevation_gain ? t.elevation_gain.toLocaleString() + " ft" : "—";
      document.getElementById("stat-type").textContent   = formatType(t.trail_type);
      document.getElementById("stat-time").textContent   = t.est_time_hr    ? t.est_time_hr + " hr"                     : "—";

      // Sidebar details
      if (t.trail_type) {
        document.getElementById("type").textContent      = formatType(t.trail_type);
        document.getElementById("row-type").style.display = "";
      }
      if (t.start_elev_ft) {
        document.getElementById("start-elev").textContent       = t.start_elev_ft.toLocaleString() + " ft";
        document.getElementById("row-start-elev").style.display = "";
      }
      if (t.roughness) {
        const bar = document.getElementById("roughness");
        for (let i = 1; i <= 10; i++) {
          const pip = document.createElement("div");
          pip.className = "pip" + (i <= t.roughness ? " on" : "");
          bar.appendChild(pip);
        }
        document.getElementById("row-roughness").style.display = "";
      }
      if (t.opening_hours) {
        const h = t.opening_hours;
        document.getElementById("hours").textContent      = (h.open && h.close ? h.open + "–" + h.close : "") + (h.notes ? " " + h.notes : "");
        document.getElementById("row-hours").style.display = "";
      }
      if (t.location) {
        const lat = t.location.latitude;
        const lng = t.location.longitude;

        document.getElementById("row-location").style.display = "flex";

        // Wait for element to be visible before initialising Leaflet
        requestAnimationFrame(() => {
          const map = L.map("trail-map", {
            center: [lat, lng],
            zoom: 14,
            zoomControl: true,
            scrollWheelZoom: false,
          });

          L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
              attribution: "Tiles &copy; Esri &mdash; Source: Esri, USGS, NOAA",
              maxZoom: 19,
            }
          ).addTo(map);

          // Custom green pin to match brand
          const pin = L.divIcon({
            className: "",
            html: `<div style="
              width:14px;height:14px;
              background:var(--trail-ray);
              border:2.5px solid var(--white);
              border-radius:50%;
              box-shadow:0 2px 6px rgba(var(--black-rgb),0.4);
            "></div>`,
            iconSize: [14, 14],
            iconAnchor: [7, 7],
          });

          L.marker([lat, lng], { icon: pin }).addTo(map);
          setTimeout(() => map.invalidateSize(), 100);
        });

        // Reverse geocode - where are we by name?
        fetch(
          `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`,
          { headers: {
            "Accept-Language": "en",
            "User-Agent": "GreatOutdoorsPNWStudentProject/1.0"
          } }
        )
        .then(r => r.json())
        .then(data => {
          const a = data.address;

          // Build a readable location string from most to least specific
          const place = [
            a.natural | a.leisure || a.village || a.town || a.city || a.county || a.state_district,
            a.state || a.province,
            a.country,
          ].filter(Boolean).join(", ");

          const bar = document.getElementById("location-label");
          if (bar) bar.textContent = place;
        })
        .catch(() => {
          const bar = document.getElementById("location-label");
          if (bar) bar.textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        });


                // Weather
        const weatherCard = document.createElement("div");
        weatherCard.className = "info-row";
        weatherCard.id = "row-weather";
        weatherCard.style.display = "flex";
        weatherCard.style.flexDirection = "column";
        weatherCard.style.alignItems = "stretch";
        weatherCard.style.padding = "0";

        const weatherDiv = document.createElement("div");
        weatherDiv.id = "trail-weather";
        weatherDiv.className = "trail-weather";
        weatherDiv.textContent = "Loading forecast…";
        weatherCard.appendChild(weatherDiv);
        document.querySelector(".info-card").appendChild(weatherCard);

        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weathercode&timezone=auto&forecast_days=7&temperature_unit=fahrenheit`)
          .then(r => r.json())
          .then(data => {
            const days = data.daily;
            const codes = {
              0:"☀️",1:"🌤️",2:"⛅",3:"☁️",
              45:"🌫️",48:"🌫️",
              51:"🌦️",53:"🌦️",55:"🌧️",
              61:"🌧️",63:"🌧️",65:"🌧️",
              71:"🌨️",73:"🌨️",75:"🌨️",
              77:"🌨️",80:"🌦️",81:"🌧️",82:"⛈️",
              95:"⛈️",96:"⛈️",99:"⛈️",
            };

            weatherDiv.innerHTML = "";
            days.time.forEach((dateStr, i) => {
              const [year, month, dayNum] = dateStr.split("-").map(Number);
              const d = new Date(year, month - 1, dayNum);
              const dayLabel = d.toLocaleDateString("en-US", { weekday: "short" });
              const icon = codes[days.weathercode[i]] ?? "🌡️";
              const hi   = Math.round(days.temperature_2m_max[i]);
              const lo   = Math.round(days.temperature_2m_min[i]);
              const rain = days.precipitation_sum[i];

              const row = document.createElement("div");
              row.className = "weather-row";
              row.innerHTML = `
                <span class="weather-day">${dayLabel}</span>
                <span class="weather-icon">${icon}</span>
                <div class="weather-temps"><b>${hi}°</b><span>${lo}°</span></div>
                <span class="weather-rain">${rain > 0 ? `${rain.toFixed(1)}mm` : ""}</span>
              `;
              weatherDiv.appendChild(row);
            });
          })
          .catch(() => { weatherDiv.textContent = "Forecast unavailable."; });
      }

      // Description
      if (t.description) {
        document.getElementById("description").textContent  = t.description;
        document.getElementById("desc-label").style.display = "";
      }

      // Surfaces tags
      if (t.surfaces?.length) {
        const row = document.getElementById("surfaces");
        t.surfaces.forEach(s => {
          const span = document.createElement("span");
          span.className   = "tag";
          span.textContent = s.charAt(0).toUpperCase() + s.slice(1);
          row.appendChild(span);
        });
        document.getElementById("surfaces-section").style.display = "";
      }

      // Biomes tags
      if (t.biomes?.length) {
        const row = document.getElementById("biomes");
        t.biomes.forEach(b => {
          const span = document.createElement("span");
          span.className   = "tag";
          span.textContent = b.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
          row.appendChild(span);
        });
        document.getElementById("biomes-section").style.display = "";
      }

      // Images
      const imagesDiv = document.getElementById("images");
      const urls = (t.images ?? []).slice(0, 6);

      if (urls.length) {
        imagesDiv.className = `images-gallery count-${urls.length}`;

        urls.forEach((url, i) => {
          const wrapper = document.createElement("div");
          wrapper.className = "gallery-item";
          wrapper.dataset.index = i;

          const img = document.createElement("img");
          img.src     = url;
          img.alt     = t.name;
          img.loading = "lazy";

          wrapper.appendChild(img);
          wrapper.addEventListener("click", () => openLightbox(urls, i));
          imagesDiv.appendChild(wrapper);
        });
      }

      // Lightbox
      function openLightbox(urls, startIndex) {
        let current = startIndex;

        const overlay = document.createElement("div");
        overlay.className = "lightbox-overlay";

        const img = document.createElement("img");
        img.className = "lightbox-img";
        img.src = urls[current];

        const close = document.createElement("button");
        close.className   = "lightbox-btn lightbox-close";
        close.innerHTML   = "<i class='ti ti-x'></i>";
        close.addEventListener("click", () => overlay.remove());

        const prev = document.createElement("button");
        prev.className  = "lightbox-btn lightbox-prev";
        prev.innerHTML  = "<i class='ti ti-chevron-left'></i>";
        prev.style.display = urls.length < 2 ? "none" : "";
        prev.addEventListener("click", () => {
          current = (current - 1 + urls.length) % urls.length;
          img.src = urls[current];
        });

        const next = document.createElement("button");
        next.className  = "lightbox-btn lightbox-next";
        next.innerHTML  = "<i class='ti ti-chevron-right'></i>";
        next.style.display = urls.length < 2 ? "none" : "";
        next.addEventListener("click", () => {
          current = (current + 1) % urls.length;
          img.src = urls[current];
        });

        function handleKey(e) {
          if (e.key === "ArrowRight") { current = (current + 1) % urls.length; img.src = urls[current]; counter.textContent = `${current + 1} / ${urls.length}`; }
          if (e.key === "ArrowLeft")  { current = (current - 1 + urls.length) % urls.length; img.src = urls[current]; counter.textContent = `${current + 1} / ${urls.length}`; }
          if (e.key === "Escape") overlay.remove();
        }
        document.addEventListener("keydown", handleKey);
        overlay.addEventListener("click", e => { if (e.target === overlay) { document.removeEventListener("keydown", handleKey); overlay.remove(); } });
        close.addEventListener("click", () => { document.removeEventListener("keydown", handleKey); overlay.remove(); });

        const counter = document.createElement("div");
        counter.className = "lightbox-counter";
        counter.textContent = urls.length > 1 ? `${current + 1} / ${urls.length}` : "";

        // Update counter on nav
        [prev, next].forEach(btn => btn.addEventListener("click", () => {
          counter.textContent = `${current + 1} / ${urls.length}`;
        }));

        overlay.addEventListener("click", e => { if (e.target === overlay) overlay.remove(); });

        overlay.appendChild(img);
        overlay.appendChild(close);
        overlay.appendChild(prev);
        overlay.appendChild(next);
        overlay.appendChild(counter);
        document.body.appendChild(overlay);
      }

      // Last edited
      if (t.updated_by && t.updated_at) {
        const date = t.updated_at.toDate().toLocaleDateString();
        const lastEdited = document.getElementById("last-edited");
        const username   = t.updated_by_username ?? t.updated_by;
        const uid        = t.updated_by_uid;

        lastEdited.textContent = `Last edited by `;

        if (uid) {
          const link = document.createElement("a");
          link.href      = `user.html?uid=${uid}`;
          link.textContent = username;
          link.style.cssText = "color:inherit;text-decoration:underline;cursor:pointer;";
          lastEdited.appendChild(link);
        } else {
          lastEdited.appendChild(document.createTextNode(username));
        }

        lastEdited.appendChild(document.createTextNode(` on ${date}`));
      }
    }


    async function renderRecommendedTrails(currentId, currentTrail) {
      const snap = await getDocs(collection(db, "trails"));
      const others = snap.docs
        .filter(d => d.id !== currentId)
        .map(d => ({ id: d.id, ...d.data() }))
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);

      if (!others.length) return;

      const section = document.createElement("div");
      section.className = "recommended-section";
      section.innerHTML = `<span class="section-label">More Trails You Might Like</span>`;

      others.forEach(t => {
        const a = document.createElement("a");
        a.className = "recommended-card";
        a.href = `trail.html?id=${t.id}`;

        const img = t.images?.length
          ? `<img src="${t.images[0]}" alt="${t.name}">`
          : `<div class="recommended-card-placeholder"><i class="ti ti-mountain"></i></div>`;

        a.innerHTML = `
          ${img}
          <div class="recommended-card-body">
            <span class="recommended-card-type">${formatType(t.trail_type)}</span>
            <span class="recommended-card-name">${t.name}</span>
            <span class="recommended-card-stats">${t.length_mi} mi · ${t.elevation_gain?.toLocaleString()} ft gain</span>
          </div>
        `;
        section.appendChild(a);
      });

      document.querySelector(".comments-section").before(section);
    }

    function formatType(t) {
      return { loop: "Loop", out_and_back: "Out & Back", point_to_point: "Point to Point", lollipop: "Lollipop" }[t] ?? t;
    }

    function renderEditButton(id, user, isBanned) {
      const btn = document.getElementById("edit-trail-btn");
      if (!user || isBanned) {
        btn.style.visibility = "hidden";
        return;
      }
      btn.href = `add-trail.html?edit=${id}`;
    }

    async function renderHikedButton(user, trailId, trailData) {
      const btn = document.getElementById("hiked-trail-btn");
      const help = document.getElementById("hiked-trail-help");

      if (!btn) return;

      btn.classList.remove("logged-out", "completed");
      btn.removeAttribute("aria-disabled");
      btn.onclick = null;

      // User is logged out
      if (!user) {
        btn.innerHTML = `<i class="ti ti-lock"></i> Log in to mark as hiked`;
        btn.classList.add("logged-out");
        btn.setAttribute("aria-disabled", "true");

        help.textContent = "You need to log in before saving this trail to your hiked list.";

        btn.onclick = () => {
          window.location.href = `login.html?redirect=${encodeURIComponent(`trail.html?id=${trailId}`)}`;
        };

        return;
      }

      // User is logged in
      const hikedRef = doc(db, "users", user.uid, "hikedTrails", trailId);
      const hikedSnap = await getDoc(hikedRef);

      // Trail was already marked as hiked before
      if (hikedSnap.exists()) {
        btn.innerHTML = `<i class="ti ti-circle-check"></i> Hiked`;
        btn.classList.add("completed");
        help.textContent = "This trail is saved to your hiked trails list.";
        return;
      }

      // Trail has not been marked yet
      btn.innerHTML = `<i class="ti ti-check"></i> I've hiked this`;
      help.textContent = "Click to save this trail to your hiked trails list.";

      btn.onclick = async () => {
        try {
          await setDoc(hikedRef, {
            trail_id: trailId,
            trail_name: trailData.name ?? "Unknown Trail",
            marked_at: serverTimestamp()
          });

          btn.innerHTML = `<i class="ti ti-circle-check"></i> Hiked`;
          btn.classList.add("completed");
          help.textContent = "This trail is now saved to your hiked trails list.";

        } catch (error) {
          alert("Could not save this trail. Please try again.");
          console.error(error);
        }
      };
    }

function renderComment(c, user, commentsDiv, isMod = false, commentBanned = false, replies = [], allReplies = []) {
  const date = c.created_at?.toDate().toLocaleDateString() ?? "just now";

  const div = document.createElement("div");
  div.className = "comment-item";
  div.id = `comment-${c.id}`;

  const avatar = document.createElement("div");
  avatar.className = "comment-avatar";

  if (c.avatar) {
    const img = document.createElement("img");
    img.src = c.avatar;
    img.alt = c.username ?? "";
    avatar.appendChild(img);
  } else {
    avatar.textContent = (c.username ?? c.email ?? "?").charAt(0).toUpperCase();
  }

  avatar.style.cursor = "pointer";
  avatar.addEventListener("click", () => {
    window.location.href = `user.html?uid=${c.uid}`;
  });

  const commentInner = document.createElement("div");
  commentInner.className = "comment-inner";

  const meta = document.createElement("div");
  meta.className = "comment-meta";

  const usernameLink = document.createElement("a");
  usernameLink.href = `user.html?uid=${c.uid}`;
  usernameLink.textContent = c.username ?? c.email;
  usernameLink.style.cssText = "color:inherit;text-decoration:none;cursor:pointer;";
  usernameLink.addEventListener("mouseover", () => usernameLink.style.textDecoration = "underline");
  usernameLink.addEventListener("mouseout", () => usernameLink.style.textDecoration = "none");

  meta.appendChild(usernameLink);

  if (commentBanned) {
    const bannedSpan = document.createElement("span");
    bannedSpan.className = "comment-edited-badge";
    bannedSpan.textContent = "banned";
    bannedSpan.style.borderColor = "var(--trail-ray)";
    bannedSpan.style.color = "var(--trail-ray)";
    meta.appendChild(bannedSpan);
  }

  meta.appendChild(document.createTextNode(` · ${date}`));

  if (c.edited) {
    const badge = document.createElement("span");
    badge.className = "comment-edited-badge";
    badge.textContent = "edited";
    meta.appendChild(badge);
  }

  const body = document.createElement("div");
  body.className = "comment-body";
  body.textContent = c.contents;

  const actions = document.createElement("div");
  actions.className = "comment-actions";

  const replyContainer = document.createElement("div");
  replyContainer.className = "reply-container";
  if (!replies.length) {
    replyContainer.style = "border-left: none";
  }

  const replyBtn = document.createElement("button");
  replyBtn.className = "comment-btn reply";
  replyBtn.textContent = "Reply";

  replyBtn.addEventListener("click", () => {
    if (!user) {
      window.location.href = `login.html?redirect=${encodeURIComponent(`trail.html?id=${id}`)}`;
      return;
    }

    showReplyForm(c, user, commentInner, replyContainer, isMod);
  });

  actions.appendChild(replyBtn);

  if (user && user.uid === c.uid) {
    const deleteBtn = document.createElement("button");
    deleteBtn.className = "comment-btn delete";
    deleteBtn.textContent = "Delete";

    deleteBtn.addEventListener("click", async () => {
      await deleteDoc(doc(db, "comments", c.id));
      div.remove();
      replyContainer.remove();
    });

    const editBtn = document.createElement("button");
    editBtn.className = "comment-btn";
    editBtn.textContent = "Edit";

    editBtn.addEventListener("click", () => {
      const input = document.createElement("textarea");
      input.className = "comment-edit-area";
      input.value = c.contents;
      input.rows = 3;
      input.cols = 40;

      const saveBtn = document.createElement("button");
      saveBtn.className = "comment-btn";
      saveBtn.textContent = "Save";

      saveBtn.addEventListener("click", async () => {
        const newText = input.value.trim();
        if (!newText) return;

        await updateDoc(doc(db, "comments", c.id), {
          contents: newText,
          edited: true
        });

        c.contents = newText;
        c.edited = true;
        body.textContent = newText;

        if (![...meta.querySelectorAll(".comment-edited-badge")].some(b => b.textContent === "edited")) {
          const badge = document.createElement("span");
          badge.className = "comment-edited-badge";
          badge.textContent = "edited";
          meta.appendChild(badge);
        }

        actions.replaceChildren(replyBtn, deleteBtn, editBtn);
        commentInner.replaceChildren(meta, body, actions);
      });

      const cancelBtn = document.createElement("button");
      cancelBtn.className = "comment-btn";
      cancelBtn.textContent = "Cancel";

      cancelBtn.addEventListener("click", () => {
        actions.replaceChildren(replyBtn, deleteBtn, editBtn);
        commentInner.replaceChildren(meta, body, actions);
      });

      actions.replaceChildren(saveBtn, cancelBtn);
      commentInner.replaceChildren(meta, input, actions);
    });

    actions.appendChild(deleteBtn);
    actions.appendChild(editBtn);
  }

  if (isMod && (!user || user.uid !== c.uid)) {
    const modDelete = document.createElement("button");
    modDelete.className = "comment-btn mod-delete";
    modDelete.textContent = "Delete";
    modDelete.addEventListener("click", async () => {
      if (!confirm(`Delete this comment by ${c.username ?? c.email}?`)) return;
      await deleteDoc(doc(db, "comments", c.id));
      div.remove();
      replyContainer.remove();
    });
    actions.appendChild(modDelete);
  }

  commentInner.appendChild(meta);
  commentInner.appendChild(body);
  commentInner.appendChild(actions);

  div.appendChild(avatar);
  div.appendChild(commentInner);
  commentsDiv.appendChild(div);

  replies.forEach(reply => {
    renderReply(reply, user, replyContainer, isMod, allReplies);
  });

  commentsDiv.appendChild(replyContainer);
}

function renderReply(reply, user, replyContainer, isMod = false, allReplies = []) {
  const date = reply.created_at?.toDate().toLocaleDateString() ?? "just now";

  const replyDiv = document.createElement("div");
  replyDiv.className = "reply-item";
  replyDiv.id = `comment-${reply.id}`;

  const avatar = document.createElement("div");
  avatar.className = "comment-avatar";

  if (reply.avatar) {
    const img = document.createElement("img");
    img.src = reply.avatar;
    img.alt = reply.username ?? "";
    avatar.appendChild(img);
  } else {
    avatar.textContent = (reply.username ?? reply.email ?? "?").charAt(0).toUpperCase();
  }

  avatar.style.cursor = "pointer";
  avatar.addEventListener("click", () => {
    window.location.href = `user.html?uid=${reply.uid}`;
  });

  const replyInner = document.createElement("div");
  replyInner.className = "comment-inner";

  const meta = document.createElement("div");
  meta.className = "comment-meta";

  const usernameLink = document.createElement("a");
  usernameLink.href = `user.html?uid=${reply.uid}`;
  usernameLink.textContent = reply.username ?? reply.email;
  usernameLink.style.cssText = "color:inherit;text-decoration:none;cursor:pointer;";
  usernameLink.addEventListener("mouseover", () => usernameLink.style.textDecoration = "underline");
  usernameLink.addEventListener("mouseout", () => usernameLink.style.textDecoration = "none");

  meta.appendChild(usernameLink);
  meta.appendChild(document.createTextNode(` · ${date}`));

  if (reply.edited) {
    const badge = document.createElement("span");
    badge.className = "comment-edited-badge";
    badge.textContent = "edited";
    meta.appendChild(badge);
  }

  const body = document.createElement("div");
  body.className = "comment-body";
  body.textContent = reply.contents;

  const actions = document.createElement("div");
  actions.className = "comment-actions";

  const nestedContainer = document.createElement("div");
  nestedContainer.className = "reply-container nested-reply-container";
  if (!allReplies.length) {
    nestedContainer.style = "border-left: none";
  }

  const replyBtn = document.createElement("button");
  replyBtn.className = "comment-btn reply";
  replyBtn.textContent = "Reply";

  replyBtn.addEventListener("click", () => {
    if (!user) {
      window.location.href = `login.html?redirect=${encodeURIComponent(`trail.html?id=${id}`)}`;
      return;
    }

    showReplyForm(reply, user, replyInner, nestedContainer, isMod);
  });

  actions.appendChild(replyBtn);

  if (user && user.uid === reply.uid) {
    const deleteBtn = document.createElement("button");
    deleteBtn.className = "comment-btn delete";
    deleteBtn.textContent = "Delete";

    deleteBtn.addEventListener("click", async () => {
      if (!confirm("Delete your reply?")) return;
      await deleteDoc(doc(db, "comments", reply.id));
      replyDiv.remove();
      nestedContainer.remove();
    });

    const editBtn = document.createElement("button");
    editBtn.className = "comment-btn";
    editBtn.textContent = "Edit";

    editBtn.addEventListener("click", () => {
      const input = document.createElement("textarea");
      input.className = "comment-edit-area";
      input.value = reply.contents;
      input.rows = 3;

      const editActions = document.createElement("div");
      editActions.className = "comment-actions";

      const saveBtn = document.createElement("button");
      saveBtn.className = "comment-btn";
      saveBtn.textContent = "Save";

      const cancelBtn = document.createElement("button");
      cancelBtn.className = "comment-btn delete";
      cancelBtn.textContent = "Cancel";

      saveBtn.addEventListener("click", async () => {
        const newText = input.value.trim();

        if (!newText) {
          alert("Reply cannot be empty.");
          return;
        }

        await updateDoc(doc(db, "comments", reply.id), {
          contents: newText,
          edited: true
        });

        reply.contents = newText;
        reply.edited = true;
        body.textContent = newText;

        if (![...meta.querySelectorAll(".comment-edited-badge")].some(b => b.textContent === "edited")) {
          const badge = document.createElement("span");
          badge.className = "comment-edited-badge";
          badge.textContent = "edited";
          meta.appendChild(badge);
        }

        replyInner.replaceChildren(meta, body, actions);
      });

      cancelBtn.addEventListener("click", () => {
        replyInner.replaceChildren(meta, body, actions);
      });

      editActions.appendChild(saveBtn);
      editActions.appendChild(cancelBtn);
      replyInner.replaceChildren(meta, input, editActions);
    });

    actions.appendChild(deleteBtn);
    actions.appendChild(editBtn);
  }

  if (isMod && (!user || user.uid !== reply.uid)) {
    const modDelete = document.createElement("button");
    modDelete.className = "comment-btn mod-delete";
    modDelete.textContent = "Delete";

    modDelete.addEventListener("click", async () => {
      if (!confirm(`Delete this reply by ${reply.username ?? reply.email}?`)) return;
      await deleteDoc(doc(db, "comments", reply.id));
      replyDiv.remove();
      nestedContainer.remove();
    });

    actions.appendChild(modDelete);
  }

  replyInner.appendChild(meta);
  replyInner.appendChild(body);
  replyInner.appendChild(actions);

  replyDiv.appendChild(avatar);
  replyDiv.appendChild(replyInner);
  replyContainer.appendChild(replyDiv);

  const nestedReplies = allReplies.filter(r => r.parent_id === reply.id);
  nestedReplies.forEach(nestedReply => {
    renderReply(nestedReply, user, nestedContainer, isMod, allReplies);
  });
  if (!allReplies.length) {
    nestedContainer.style = "border-left: none";
  }

  replyContainer.appendChild(nestedContainer);
}

function showReplyForm(parentComment, user, formParent, targetReplyContainer, isMod = false) {
  const existingForm = formParent.querySelector(":scope > .reply-form");

  if (existingForm) {
    existingForm.remove();
    return;
  }

  const replyForm = document.createElement("div");
  replyForm.className = "reply-form";

  replyForm.innerHTML = `
    <textarea class="reply-input" rows="3" maxlength="1000" placeholder="Write a reply…"></textarea>
    <div class="reply-form-actions">
      <button class="reply-submit-btn" type="button">Post Reply</button>
      <button class="reply-cancel-btn" type="button">Cancel</button>
    </div>
  `;

  const input = replyForm.querySelector(".reply-input");
  const submitBtn = replyForm.querySelector(".reply-submit-btn");
  const cancelBtn = replyForm.querySelector(".reply-cancel-btn");

  submitBtn.addEventListener("click", async () => {
    const contents = input.value.trim();

    if (!contents) {
      alert("Please write a reply first.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Posting…";

    try {
      const userSnap = await getDoc(doc(db, "users", user.uid));
      const username = userSnap.exists() ? userSnap.data().username : user.email;
      const avatar = userSnap.exists() ? userSnap.data().avatar ?? null : null;

      const ref = await addDoc(collection(db, "comments"), {
        trail_id: id,
        uid: user.uid,
        email: user.email,
        username: username,
        avatar: avatar,
        contents: contents,
        created_at: serverTimestamp(),
        parent_id: parentComment.id,
        parent_uid: parentComment.uid,
        parent_username: parentComment.username ?? parentComment.email
      });

      const newReply = {
        id: ref.id,
        uid: user.uid,
        email: user.email,
        username: username,
        avatar: avatar,
        contents: contents,
        edited: false,
        created_at: { toDate: () => new Date() },
        parent_id: parentComment.id,
        parent_uid: parentComment.uid,
        parent_username: parentComment.username ?? parentComment.email
      };

      renderReply(newReply, user, targetReplyContainer, isMod, []);
      replyForm.remove();
      targetReplyContainer.style = "border-left: 2px solid var(--trail-fog)";

    } catch (error) {
      console.error("Error posting reply:", error);
      alert("Could not post reply. Please try again.");
      submitBtn.disabled = false;
      submitBtn.textContent = "Post Reply";
    }
  });

  cancelBtn.addEventListener("click", () => {
    replyForm.remove();
  });

  formParent.appendChild(replyForm);
  input.focus();
}
