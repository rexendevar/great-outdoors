<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile</title>
  <link rel="stylesheet" href="../Styles/great-outdoors.css">
  <link rel="stylesheet" href="../Styles/user.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
  <div id="site-nav-container"></div>
  <div class="profile-page-bg">
    <img src="../Images/pilchuk.jpg" alt="">
    <div class="profile-page-bg-fade"></div>
  </div>
  <div class="page-header">
  <!-- <img class="hero-img" src="../Images/pilchuk.jpg" alt="Mountain at sunset">
  <div class="hero-overlay"></div> -->
  <div class="profile-hero-inner">
    <div class="profile-avatar" id="profile-avatar"></div>
    <div class="profile-username" id="profile-username"></div>
  </div>
</div>

  <div id="status" class="status-screen">
    <div class="spinner"></div>
    <span>Loading profile…</span>
  </div>

  <div id="content" style="display:none">
  <div class="profile-layout">

    <!-- <div class="profile-side profile-side--left">
      <img src="../Images/pilchuk.jpg" alt="">
      <div class="profile-side-fade"></div>
    </div> -->

    <div class="profile-wrapper">
      <p class="profile-bio" id="profile-bio"></p>
      <div class="profile-section">
        <span class="profile-section-heading">Trails Hiked</span>
        <div class="hiked-list" id="hiked-list"></div>
      </div>
    </div>

    <!-- <div class="profile-side profile-side--right">
      <img src="../Images/pilchuk.jpg" alt="">
      <div class="profile-side-fade"></div>
    </div> -->

  </div>
</div>

  <script type="module">
    import { initializeApp }    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, collection, getDocs, orderBy, query, serverTimestamp }
                                from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig }   from "../Scripts/great_outdoors.js";
    import { isModerator } from "../Scripts/great_outdoors.js";

    const db = getFirestore(initializeApp(firebaseConfig));

    function showError(msg) {
      document.getElementById("status").innerHTML = `<span>${msg}</span>`;
    }

    const uid = new URLSearchParams(window.location.search).get("uid");

    if (!uid) {
      showError("No user specified.");
    } else {
      const userSnap = await getDoc(doc(db, "users", uid));

      if (!userSnap.exists()) {
        showError("User not found.");
      } else {
        const u = userSnap.data();

        document.title = `${u.username} — Great Outdoors`;

        // Avatar
        const avatarEl = document.getElementById("profile-avatar");
        if (u.avatar) {
          const img = document.createElement("img");
          img.src = u.avatar;
          img.alt = u.username;
          avatarEl.appendChild(img);
        } else {
          avatarEl.textContent = (u.username ?? "?").charAt(0).toUpperCase();
        }

        // Username + bio
        document.getElementById("profile-username").textContent = u.username ?? "Unknown";
        //document.getElementById("header-username").textContent = u.username ?? "User Profile";
        document.getElementById("profile-bio").textContent      = u.bio ?? "";


        // Ban status
        const modSnap = await getDoc(doc(db, "users", uid, "moderation", "status"));
        const isBanned = modSnap.exists() && modSnap.data().banned === true;

        if (isBanned) {
          const badge = document.createElement("div");
          badge.className   = "banned-badge";
          badge.textContent = "(banned)";
          badge.style = "color:var(--trail-gold)";
          document.getElementById("profile-username").after(badge);
        }

        // Mod controls
        // import { isModerator } from "../Scripts/great_outdoors.js"; // already at top
        const { auth, onAuthStateChanged } = await import("../Scripts/great_outdoors.js");

        onAuthStateChanged(auth, async (viewer) => {
          if (!viewer) return;
          const viewerIsMod = await isModerator(viewer.uid);
          if (!viewerIsMod || viewer.uid === uid) return;

          const modBox = document.createElement("div");
          modBox.className = "mod-box";

          const banBtn = document.createElement("button");
          banBtn.className   = "submit-btn";
          banBtn.style.background = isBanned ? "var(--trail-sage)" : "var(--trail-gold)";
          banBtn.textContent = isBanned ? "Unban User" : "Ban User";

          banBtn.addEventListener("click", async () => {
            if (!confirm(isBanned ? `Unban ${u.username}?` : `Ban ${u.username}? They will not be able to post or edit.`)) return;
            if (isBanned) {
              await setDoc(doc(db, "users", uid, "moderation", "status"), { banned: false });
              banBtn.textContent = "Ban User";
              banBtn.style.background = "#A03030";
              document.querySelector(".banned-badge")?.remove();
              window.location.reload();
            } else {
              await setDoc(doc(db, "users", uid, "moderation", "status"), {
                banned: true,
                banned_at: serverTimestamp(),
                banned_by: viewer.uid,
              });
              banBtn.textContent = "Unban User";
              banBtn.style.background = "var(--trail-sage)";
              if (!document.querySelector(".banned-badge")) {
                const badge = document.createElement("div");
                badge.className   = "banned-badge";
                badge.textContent = "(banned)";
                badge.style = "color:var(--trail-gold)";
                document.getElementById("profile-username").after(badge);
              }
              window.location.reload();
            }
          });

          modBox.appendChild(banBtn);
          document.querySelector(".profile-wrapper").prepend(modBox);
        });

        // Hiked trails
        const hikedSnap = await getDocs(
          query(collection(db, "users", uid, "hikedTrails"), orderBy("marked_at", "desc"))
        );

        const list = document.getElementById("hiked-list");

        if (hikedSnap.empty) {
          list.innerHTML = `<p class="profile-empty">No trails hiked yet.</p>`;
        } else {
          hikedSnap.forEach(d => {
            const h    = d.data();
            const date = h.marked_at?.toDate().toLocaleDateString() ?? "";

            const a = document.createElement("a");
            a.className = "hiked-item";
            a.href      = `trail.html?id=${h.trail_id}`;

            const name = document.createElement("span");
            name.className   = "hiked-item-name";
            name.textContent = h.trail_name ?? "Unknown Trail";

            const dateEl = document.createElement("span");
            dateEl.className   = "hiked-item-date";
            dateEl.textContent = date;

            a.appendChild(name);
            a.appendChild(dateEl);
            list.appendChild(a);
          });
        }

        document.getElementById("status").style.display  = "none";
        document.getElementById("content").style.display = "";
      }
    }
  </script>
</body>
</html>
